name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # No installs. The checks use the standard library only. Tests that need
      # numpy are skipped, and the R tests report SKIPPED-NO-R without failing.
      - name: Tests and style checks
        run: bash scripts/check_style.sh

  # A render job is not enabled in v0.1. It would install Quarto and R in CI.
  # Enabling it is the maintainer's decision. The actions are pinned by SHA.
